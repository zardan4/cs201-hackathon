<form method="post" action="{{ form_action }}" class="profile-form">
  <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
  <div class="form-card">
    <div class="field">
      <label for="position">Role</label>
      <select id="position" name="position" required>
        <option value="">Choose your role</option>
        {% for position in positions %}<option value="{{ position }}"{% if position == values.position %} selected{% endif %}>{{ position }}</option>{% endfor %}
      </select>
    </div>
    <div class="field-row">
      <div class="field">
        <label for="experience_years">Experience, years</label>
        <input id="experience_years" name="experience_years" type="number" inputmode="decimal" min="0" max="80" step="0.1" value="{{ values.experience_years }}" placeholder="2.5" required>
      </div>
      <div class="field">
        <label for="english_level">English</label>
        <select id="english_level" name="english_level" required>
          <option value="">Level</option>
          {% for value, label in english_levels.items() %}<option value="{{ value }}"{% if value == values.english_level %} selected{% endif %}>{{ label }}</option>{% endfor %}
        </select>
      </div>
    </div>
  </div>
  <fieldset class="form-card skills-card" data-skills>
    <legend class="skills-head">
      <span class="skills-title"><span class="skills-title__icon" aria-hidden="true">+</span>Skills</span>
      <span class="skills-count" data-skills-count aria-live="polite"></span>
    </legend>
    <div class="skills-selected" data-skills-selected aria-label="Selected skills"></div>
    <div class="skills-tools">
      <input type="search" class="skills-search" placeholder="Search…" aria-label="Search skills" autocomplete="off" data-skills-search>
      <button type="button" class="skills-toggle" aria-expanded="false" hidden data-skills-toggle>Browse catalogue</button>
    </div>
    <div class="skills-catalog" data-skills-catalog>
      {% for group in skill_groups %}
      <details class="skill-group" open data-skill-group>
        <summary><span>{{ group.label }}</span><small>{{ group.skills | length }}</small></summary>
        <div class="skill-options">
          {% for skill in group.skills %}
            <label class="skill-option" data-skill="{{ skill }}"><input type="checkbox" name="skills" value="{{ skill }}"{% if skill in values.skills %} checked{% endif %}> <span>{{ skill }}</span></label>
          {% endfor %}
        </div>
      </details>
      {% else %}
        {% for skill in skills %}
          <label class="skill-option" data-skill="{{ skill }}"><input type="checkbox" name="skills" value="{{ skill }}"{% if skill in values.skills %} checked{% endif %}> <span>{{ skill }}</span></label>
        {% endfor %}
      {% endfor %}
      <p class="skills-empty" hidden data-skills-empty>{% from "_mascot.html" import mascot %}{{ mascot('sad', 40) }}No skills match.</p>
    </div>
  </fieldset>
  <label class="switch"><input type="checkbox" name="remote_only"{% if values.remote_only %} checked{% endif %}><span class="switch__track" aria-hidden="true"></span><span>Remote jobs only</span></label>
  <button type="submit" class="button">{{ submit_label }}</button>
</form>
