<form method="post" action="{{ form_action }}" class="profile-form">
  <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
  <div class="form-grid">
    <div>
      <label for="position">Your role</label>
      <select id="position" name="position" required>
        <option value="">Choose your role</option>
        {% for position in positions %}<option value="{{ position }}"{% if position == values.position %} selected{% endif %}>{{ position }}</option>{% endfor %}
      </select>
    </div>
    <div>
      <label for="experience_years">Years of experience</label>
      <input id="experience_years" name="experience_years" type="number" min="0" max="80" step="0.1" value="{{ values.experience_years }}" placeholder="e.g. 2.5" required>
    </div>
    <div>
      <label for="english_level">English level</label>
      <select id="english_level" name="english_level" required>
        <option value="">Choose your English level</option>
        {% for value, label in english_levels.items() %}<option value="{{ value }}"{% if value == values.english_level %} selected{% endif %}>{{ label }}</option>{% endfor %}
      </select>
    </div>
  </div>
  <fieldset>
    <legend>Your skills</legend>
    <p class="field-hint">Detected skills are selected. Add or remove skills to match what you know. Select at least one.</p>
    <div class="skill-options">
      {% for skill in skills %}
        <label class="skill-option"><input type="checkbox" name="skills" value="{{ skill }}"{% if skill in values.skills %} checked{% endif %}> <span>{{ skill }}</span></label>
      {% endfor %}
    </div>
  </fieldset>
  <label class="checkbox-label"><input type="checkbox" name="remote_only"{% if values.remote_only %} checked{% endif %}> Show remote jobs only</label>
  <button type="submit" class="button">{{ submit_label }}</button>
</form>
