<form method="post" action="{{ form_action }}" class="profile-form">
  <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
  <div class="form-card">
    <div class="field">
      <label for="position">Role</label>
      <select id="position" name="position" required>
        <option value="">Choose your role</option>
        {% for position in positions %}<option value="{{ position }}"{% if position == values.position %} selected{% endif %}>{{ position }}</option>{% endfor %}
      </select>
    </div>
    <div class="field-row">
      <div class="field">
        <label for="experience_years">Experience, years</label>
        <input id="experience_years" name="experience_years" type="number" inputmode="decimal" min="0" max="80" step="0.1" value="{{ values.experience_years }}" placeholder="2.5" required>
      </div>
      <div class="field">
        <label for="english_level">English</label>
        <select id="english_level" name="english_level" required>
          <option value="">Level</option>
          {% for value, label in english_levels.items() %}<option value="{{ value }}"{% if value == values.english_level %} selected{% endif %}>{{ label }}</option>{% endfor %}
        </select>
      </div>
    </div>
  </div>
  <fieldset class="form-card skills-card" data-skills>
    <legend class="skills-head"><span>Skills</span> <span class="skills-count" data-skills-count aria-live="polite"></span></legend>
    <input type="search" class="skills-search" placeholder="Search skills" aria-label="Search skills" autocomplete="off" data-skills-search>
    <div class="skill-options">
      {# Selected skills first, so the user sees what is already chosen. #}
      {% for skill in skills if skill in values.skills %}
        <label class="skill-option" data-skill="{{ skill }}"><input type="checkbox" name="skills" value="{{ skill }}" checked> <span>{{ skill }}</span></label>
      {% endfor %}
      {% for skill in skills if skill not in values.skills %}
        <label class="skill-option" data-skill="{{ skill }}"><input type="checkbox" name="skills" value="{{ skill }}"> <span>{{ skill }}</span></label>
      {% endfor %}
      <p class="skills-empty" hidden data-skills-empty>No skills match.</p>
    </div>
  </fieldset>
  <label class="switch"><input type="checkbox" name="remote_only"{% if values.remote_only %} checked{% endif %}><span class="switch__track" aria-hidden="true"></span><span>Remote jobs only</span></label>
  <button type="submit" class="button">{{ submit_label }}</button>
</form>
