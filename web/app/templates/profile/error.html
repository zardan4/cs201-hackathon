{% extends "base.html" %}
{% block title %}{{ title }}{% endblock %}
{% block content %}
<section class="panel">
  <h1>{{ title }}</h1><p role="alert">{{ message }}</p>
  <a class="button" href="{{ url_for('profile.index' if g.onboarding_complete | default(false) else 'profile.onboarding') }}">Back to your profile</a>
</section>
{% endblock %}
